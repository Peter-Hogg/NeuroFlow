[project]
name = "neuroflow"
version = "0.1.0"
description = "Lazy execution and interoperability for archive-scale NWB analysis"
readme = "README.md"
authors = [
    { name = "Peter Hogg", email = "peterhogg2006@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["dandi", "dask", "neuroscience", "nwb", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "dask[distributed]>=2026.7.1",
    "fsspec>=2026.7.0",
    "hdmf-zarr>=0.13.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=25.0.0",
    "pynwb>=4.1.0",
    "remfile>=0.1.13",
    "rich>=15.0.0",
    "s3fs>=2026.7.0",
    "scipy>=1.15.3",
    "typer>=0.27.0",
    "xarray>=2025.6.1",
    "zarr>=2.18.3",
]

[project.optional-dependencies]
cellpose = ["cellpose>=4.1"]
pynapple = ["pynapple>=0.11"]

[project.scripts]
neuroflow = "neuroflow.cli:app"

[project.urls]
Homepage = "https://github.com/Peter-Hogg/NeuroFlow"
Documentation = "https://github.com/Peter-Hogg/NeuroFlow#readme"
Issues = "https://github.com/Peter-Hogg/NeuroFlow/issues"
Repository = "https://github.com/Peter-Hogg/NeuroFlow.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neuroflow", "neuroflow_cellpose", "neuroflow_pynapple"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
pythonpath = ["."]
testpaths = ["tests"]

[tool.basedpyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["neuroflow", "neuroflow_cellpose", "neuroflow_pynapple", "tests"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "ipykernel>=7.3.0",
    "ipython>=8.39.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.1",
]
