name: Tests

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.10
      - run: uv sync --locked --dev
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run basedpyright
      - name: Check documentation links
        run: uv run python scripts/check_docs.py

  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --dev --python ${{ matrix.python }}
      - name: Test with coverage
        run: >-
          uv run --python ${{ matrix.python }} pytest
          --cov=neuroflow
          --cov=neuroflow_cellpose
          --cov=neuroflow_pynapple
          --cov-report=term-missing
          --cov-fail-under=80

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.10
      - name: Build wheel and source distribution
        run: uv build
      - name: Install wheel in a clean environment
        run: |
          uv venv /tmp/neuroflow-wheel-test --python 3.10
          uv pip install --python /tmp/neuroflow-wheel-test/bin/python dist/*.whl
          /tmp/neuroflow-wheel-test/bin/python -c "import neuroflow; print(neuroflow.__version__)"
          /tmp/neuroflow-wheel-test/bin/neuroflow --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  optional-pynapple:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.10
      - run: uv sync --locked --dev --extra pynapple
      - run: uv run pytest -q tests/test_pynapple_adapter.py

  minimum-direct-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.10
      - run: uv sync --resolution lowest-direct --dev
      - run: uv run pytest -q
