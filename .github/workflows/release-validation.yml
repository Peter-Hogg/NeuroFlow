name: Release validation

on:
  workflow_dispatch:

jobs:
  cellpose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.10
      - run: uv sync --locked --dev --extra cellpose
      - name: Import the installed Cellpose implementation
        run: uv run python -c "from cellpose.models import CellposeModel; print(CellposeModel)"
      - name: Validate installed Cellpose adapter
        run: uv run pytest -q tests/test_cellpose_adapter.py
      - name: Compare real direct and NeuroFlow-mediated Cellpose
        env:
          NEUROFLOW_RUN_REAL_CELLPOSE: "1"
          NEUROFLOW_CELLPOSE_MODEL: cpsam
        run: uv run pytest -q tests/test_cellpose_real.py

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.10
      - run: uv sync --locked --dev
      - run: >-
          uv run python -m benchmarks.benchmark_projection
          --output benchmarks/results/ci-local-projection.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: benchmarks/results/*.json
